# Dependency updates.
#
# The gap this closes: nothing in the repo told you when a dependency went bad.
# Lockfiles guarantee you install exactly what you committed, which is the
# right property — and it also means a vulnerable version stays pinned
# indefinitely unless something nudges you.
#
# `github-actions` is listed first on purpose. The workflow pins actions by tag
# (`actions/checkout@v5`), and a tag is mutable — whoever controls the repo can
# repoint it. Pinning by commit SHA is stricter, and unreadable to maintain by
# hand; Dependabot updating SHAs for you is what makes that trade affordable.
# Until then, tags plus prompt updates is the reasonable middle.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for everything non-major. A hobby repo does not want six PRs a
    # week, and reviewing them individually is how you stop reviewing them.
    groups:
      all-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is the Go rewrite, and it changes the compiler API.
      # `tsc --noEmit` is fine — `pnpm check` passed on 7.0.2 — but Vercel CLI
      # 58.x calls the TypeScript API programmatically during `vercel build`
      # and dies with "Cannot read properties of undefined (reading
      # 'readFile')". Tried and reverted on 2026-08-08.
      #
      # The lesson is in which check caught it: typecheck and tests are not the
      # build. Revisit when the Vercel CLI supports TS 7, and verify by running
      # `vercel build` locally, not just `pnpm check`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node should track the Node major actually running in CI and on
      # Vercel (24). Newer types describe APIs that are not there at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

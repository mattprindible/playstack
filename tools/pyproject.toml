[project]
name = "playstack-ops"
version = "0.1.0"
description = "Operational scripts for the playstack monorepo."
readme = "README.md"
requires-python = ">=3.13"

# Two dependencies, deliberately. uv resolves them into uv.lock with hashes for
# every transitive package, and `uv sync --locked` in CI installs exactly that
# set or fails. Same guarantee pnpm's lockfile gives the JS side.
#
# pyjwt arrived when the guestbook stopped accepting unattributed writes: every
# insert now needs an ES256 token minted from the project signing key, and
# hand-rolling that encoding in Python to save a dependency would be exactly
# the wrong trade.
dependencies = ["httpx>=0.28", "pyjwt[crypto]>=2.13.0"]

[project.scripts]
playstack-ops = "playstack_ops.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

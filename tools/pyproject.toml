[project]
name = "playstack-ops"
version = "0.1.0"
description = "Operational scripts for the playstack monorepo."
readme = "README.md"
requires-python = ">=3.13"

# One dependency, deliberately. uv resolves it into uv.lock with hashes for
# every transitive package, and `uv sync --locked` in CI installs exactly that
# set or fails. Same guarantee pnpm's lockfile gives the JS side.
dependencies = ["httpx>=0.28"]

[project.scripts]
playstack-ops = "playstack_ops.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

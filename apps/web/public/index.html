<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playstack Guestbook</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>"
    />
  </head>
  <body>
    <main>
      <header class="masthead">
        <h1>Guestbook</h1>
        <p class="subtitle">
          One table, one form, one shared handler — running on
          <span id="platform" class="platform" aria-live="polite">…</span>
        </p>
      </header>

      <form id="form" class="card" autocomplete="off">
        <!-- The server decides who you are; there is no name field anywhere in
             this app, because every deployment is gated and the API overwrites
             `name` with the verified identity. -->
        <p id="whoami" class="whoami" hidden></p>

        <!-- Only shown for gates we can actually sign out of. Cloudflare Access
             sessions are managed by Cloudflare, not by this app. -->
        <button type="button" id="signout" class="linklike" hidden>Sign out</button>

        <!-- ATProto sign-in. Revealed only when that gate is active and you
             are not signed in. There is no password field, deliberately:
             your handle is all we need to find your PDS and send you there. -->
        <div class="field" id="atproto-login" hidden>
          <label for="handle">Sign in with your ATProto handle</label>
          <div class="row">
            <input id="handle" name="handle" placeholder="san.haha.computer" />
            <button type="button" id="signin">Sign in</button>
          </div>
        </div>

        <div class="field">
          <label for="body">Message</label>
          <textarea id="body" name="body" maxlength="500" rows="3" required
            placeholder="Say hello…"></textarea>
          <span class="counter"><span id="count">0</span>/500</span>
        </div>

        <button type="submit" id="submit">Sign the guestbook</button>
        <p id="error" class="error" role="alert" hidden></p>
      </form>

      <!-- Populated from the signed-in user's own social graph. Every name here
           was read on their behalf — nothing about the wider network is stored
           or indexed by this app. -->
      <section id="graph" class="card" hidden aria-labelledby="graph-heading">
        <h2 id="graph-heading" class="graph-heading">Your graph</h2>
        <p id="graph-summary" class="subtitle"></p>
        <ul id="follows" class="follows"></ul>
      </section>

      <section aria-labelledby="entries-heading">
        <h2 id="entries-heading" class="visually-hidden">Entries</h2>
        <ul id="entries" class="entries"></ul>
        <p id="empty" class="empty" hidden>No messages yet. Be the first.</p>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
